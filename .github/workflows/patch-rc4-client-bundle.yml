name: Patch DSH 0.2.1 clientBundle contract

on:
  push:
    branches:
      - compat/dsh-0.2.1-rc.4
    paths:
      - .github/workflows/patch-rc4-client-bundle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update synthetic native package to the DSH 0.2.1 clientBundle API
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'tools/prepare-native-manager.mjs'
          let source = fs.readFileSync(path, 'utf8')
          const oldBlock = `await writeFile(join(packageDir, 'tsdown.config.ts'), \`\nimport { clientBundle } from '../tsdown.client.ts'\n\nconst id = "@stolyarovmn/dsh-schedule-native-manager"\nconst configs = clientBundle(id, ['lib/types/index.js'])({ env: {} })\nexport default configs.filter(config => config.name === id + '/client')\n\`)`
          const newBlock = `await writeFile(join(packageDir, 'tsdown.config.ts'), \`\nimport { clientBundle } from '../tsdown.client.ts'\n\nexport default clientBundle(import.meta.dirname, ['lib/types/index.js'])\n\`)`
          if (!source.includes(oldBlock)) throw new Error('old clientBundle generator not found')
          source = source.replace(oldBlock, newBlock)
          fs.writeFileSync(path, source)

          const testPath = 'test/contract.test.js'
          let tests = fs.readFileSync(testPath, 'utf8')
          const anchor = "assert.ok(nativeBuild.includes('IconQueueOutlineRegular'), 'linked Session action must use the native Queue glyph')"
          if (!tests.includes(anchor)) throw new Error('contract test anchor not found')
          const assertion = "assert.ok(nativeBuild.includes(\"clientBundle(import.meta.dirname, ['lib/types/index.js'])\"), 'native helper build must use the DSH 0.2.1 package-directory clientBundle contract')\n"
          tests = tests.replace(anchor, assertion + anchor)
          fs.writeFileSync(testPath, tests)
          NODE
          node --check tools/prepare-native-manager.mjs
          node --test test/contract.test.js
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-rc4-client-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prepare-native-manager.mjs test/contract.test.js .github/workflows/patch-rc4-client-bundle.yml
          git commit -m "fix: use DSH 0.2.1 clientBundle package directory"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
