name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json
      - lib/**
      - icon.svg
      - cordis.patch.yml
      - .github/workflows/publish.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${{ github.event.release.tag_name }}" = "v$VERSION"

      - name: Test package
        run: npm test

      - name: Validate browser bundle
        run: npm run test:bundle

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CURRENT="$(npm view @stolyarovmn/dsh-client-ui-schedule-tab@"$VERSION" version 2>/dev/null || true)"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already on npm; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        shell: bash
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public
