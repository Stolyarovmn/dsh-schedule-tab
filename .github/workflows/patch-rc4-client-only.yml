name: Patch native helper to DSH client-only build

on:
  push:
    branches:
      - compat/dsh-0.2.1-rc.4
    paths:
      - .github/workflows/patch-rc4-client-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep the synthetic native fork on the Client artifact only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'tools/prepare-native-manager.mjs'
          let source = fs.readFileSync(path, 'utf8')
          const oldBlock = `await writeFile(join(packageDir, 'tsdown.config.ts'), \`\nimport { clientBundle } from '../tsdown.client.ts'\n\nexport default clientBundle(import.meta.dirname, ['lib/types/index.js'])\n\`)`
          const newBlock = `await writeFile(join(packageDir, 'tsdown.config.ts'), \`\nimport { clientBundle } from '../tsdown.client.ts'\n\nconst id = "@stolyarovmn/dsh-schedule-native-manager"\nconst configs = clientBundle(import.meta.dirname, [])({ env: {} })\nexport default configs.filter(config => config.name === id + '/client')\n\`)`
          if (!source.includes(oldBlock)) throw new Error('current clientBundle generator not found')
          source = source.replace(oldBlock, newBlock)
          fs.writeFileSync(path, source)

          const testPath = 'test/contract.test.js'
          let tests = fs.readFileSync(testPath, 'utf8')
          const oldAssert = `assert.ok(nativeBuild.includes("clientBundle(import.meta.dirname, ['lib/types/index.js'])"), 'native helper build must use the DSH 0.2.1 package-directory clientBundle contract')`
          const newAssert = `assert.ok(nativeBuild.includes('clientBundle(import.meta.dirname, [])({ env: {} })'), 'native helper must use the DSH 0.2.1 package-directory clientBundle contract and select only the Client artifact')\nassert.ok(nativeBuild.includes("configs.filter(config => config.name === id + '/client')"), 'synthetic native helper must not build a Node-half entry it does not own')`
          if (!tests.includes(oldAssert)) throw new Error('clientBundle test assertion not found')
          tests = tests.replace(oldAssert, newAssert)
          fs.writeFileSync(testPath, tests)
          NODE
          node --check tools/prepare-native-manager.mjs
          node --test test/contract.test.js
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-rc4-client-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prepare-native-manager.mjs test/contract.test.js .github/workflows/patch-rc4-client-only.yml
          git commit -m "fix: build only native Schedule client artifact"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
