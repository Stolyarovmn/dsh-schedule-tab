name: Build native schedule snapshot

on:
  push:
    branches: [feat/0.8.0-native-task-actions]
    paths:
      - src/client-shell.js
      - tools/prepare-native-manager.mjs
      - package.json
      - .github/workflows/build-native-manager.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-schedule-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned DSH source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.0-rc.2
          path: .dsh-src

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: .dsh-src/pnpm-lock.yaml

      - name: Install DSH build dependencies
        working-directory: .dsh-src
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare patched native TaskManager package
        run: node tools/prepare-native-manager.mjs "$GITHUB_WORKSPACE/.dsh-src"

      - name: Build native manager helper
        working-directory: .dsh-src
        run: pnpm exec tsdown --config packages/client/native-schedule-fork/tsdown.config.ts

      - name: Normalize plugin client shell
        shell: bash
        run: |
          # DSH 0.2.0-rc.2 ui-plugin-manager exports pluginNavigation, not a
          # uiPluginManager Cordis service. Package-level dsh.client.inject stays
          # responsible for activation ordering; it must not be duplicated as a
          # runtime service dependency.
          sed -i "s/, 'uiPluginManager'//g" src/client-shell.js
          # Session navigation belongs to the root uiWorkspace service. The
          # optional remote.schedule child scope only owns Schedule-dependent work.
          sed -i 's/scope\.uiWorkspace\.openSession/ctx.uiWorkspace.openSession/g; s/scope\.uiWorkspace\.startSession/ctx.uiWorkspace.startSession/g' src/client-shell.js
          if grep -Fq "uiPluginManager" src/client-shell.js; then
            echo "Client shell still declares the nonexistent uiPluginManager service" >&2
            exit 1
          fi
          if grep -Fq "scope.uiWorkspace" src/client-shell.js; then
            echo "Client shell still routes workspace navigation through the optional Schedule scope" >&2
            exit 1
          fi

      - name: Compose plugin client
        shell: bash
        run: |
          test -s .dsh-src/packages/client/native-schedule-fork/lib/client.js
          cp .dsh-src/packages/client/native-schedule-fork/lib/client.js /tmp/native-manager.js
          {
            cat /tmp/native-manager.js
            printf '\n'
            cat src/client-shell.js
          } > lib/client.js
          node --check lib/client.js
          grep -F "@stolyarovmn/dsh-schedule-native-manager" lib/client.js
          grep -F "rowQuickActions" lib/client.js
          grep -F "ctx.uiWorkspace.openSession" lib/client.js
          if grep -Fq "scope.uiWorkspace" lib/client.js; then
            echo "Generated client still navigates through the optional Schedule scope" >&2
            exit 1
          fi
          if grep -Fq "uiPluginManager" lib/client.js; then
            echo "Generated client still waits for the nonexistent uiPluginManager service" >&2
            exit 1
          fi

      - name: Verify helper externals match the DSH module table
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const source = fs.readFileSync('/tmp/native-manager.js', 'utf8')
          const requires = [...source.matchAll(/require\(["']([^"']+)["']\)/g)].map(match => match[1])
          const allowed = new Set(['react', 'react/jsx-runtime', 'react-dom', 'react-dom/client'])
          const leaked = [...new Set(requires.filter(specifier => !allowed.has(specifier)))]
          if (leaked.length > 0) {
            console.error('Native helper leaked non-platform externals:', leaked.join(', '))
            process.exit(1)
          }
          console.log('Native helper externals:', [...new Set(requires)].join(', '))
          NODE

      - name: Commit generated client
        shell: bash
        run: |
          if git diff --quiet -- src/client-shell.js lib/client.js; then
            echo "Generated client is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client-shell.js lib/client.js
          git commit -m "build: refresh pinned native TaskManager snapshot"
          # A docs/tests commit can land while this relatively expensive pinned
          # DSH build is running. Rebase the generated-only commit before push so
          # that harmless branch movement cannot lose the generated artifact.
          git fetch origin feat/0.8.0-native-task-actions
          git rebase origin/feat/0.8.0-native-task-actions
          git push origin HEAD:feat/0.8.0-native-task-actions
