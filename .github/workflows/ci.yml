name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:all
      - run: npm pack --dry-run

  dsh-install-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - 0.1.5-rc.3
          - 0.1.7-rc.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin with DSH ${{ matrix.dsh }}
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dlx @deepseek-ai/dsh@${{ matrix.dsh }} plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx @deepseek-ai/dsh@${{ matrix.dsh }} --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "schedule-tab" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-client-ui-schedule-tab" /tmp/dsh-config.txt
          grep -F "schedule-tab-host" /tmp/dsh-config.txt
          grep -F "@deepseek-ai/dsh-schedule" /tmp/dsh-config.txt
          grep -F "schedule-tab-time-context" /tmp/dsh-config.txt
          grep -F "@deepseek-ai/dsh-time-context" /tmp/dsh-config.txt
