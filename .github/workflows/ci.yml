name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:all
      - run: npm pack --dry-run

  dsh-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin with DSH 0.1.7-rc.2
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 --profile smoke --from-default-profile web --dump-config > /dev/null
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "schedule-control-center" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-client-ui-schedule-control-center" /tmp/dsh-config.txt
          grep -F "id: time-context" /tmp/dsh-config.txt
          grep -F "id: schedule" /tmp/dsh-config.txt
          grep -F "id: ui-schedule" /tmp/dsh-config.txt
          ! grep -F "scheduleTabBootstrap" /tmp/dsh-config.txt
          (
            cd "$DSH_HOME/profiles/smoke"
            node --input-type=module -e '
              const plugin = await import("@stolyarovmn/dsh-client-ui-schedule-control-center");
              if (plugin.inject.length !== 0) throw new Error("rc2 host entry must be side-effect free");
              await plugin.apply({});
            '
          )
      - name: Boot DSH Web with plugin
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        shell: bash
        run: |
          set +e
          timeout 15s pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 --profile smoke --port 0 --no-open > /tmp/dsh-web.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/dsh-web.log
          if grep -Eiq "Failed to load plugins|did not activate|entry did not activate|web boot: .*failed" /tmp/dsh-web.log; then
            echo "DSH Web reported a plugin activation failure."
            exit 1
          fi
          if ! grep -Eq "dsh web: http://127\.0\.0\.1:" /tmp/dsh-web.log; then
            echo "DSH Web did not reach the ready state."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "DSH Web exited unexpectedly with status $STATUS."
            exit "$STATUS"
          fi

