name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:all
      - run: npm pack --dry-run

  dsh-install-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - 0.1.5-rc.3
          - 0.1.7-rc.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin with DSH ${{ matrix.dsh }}
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dlx @deepseek-ai/dsh@${{ matrix.dsh }} --profile smoke --from-default-profile web --dump-config > /dev/null
          pnpm dlx @deepseek-ai/dsh@${{ matrix.dsh }} plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx @deepseek-ai/dsh@${{ matrix.dsh }} --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "schedule-tab" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-client-ui-schedule-tab" /tmp/dsh-config.txt
          grep -F "session-controller" /tmp/dsh-config.txt
          grep -F "scheduleTabBootstrap" /tmp/dsh-config.txt
          (
            cd "$DSH_HOME/profiles/smoke"
            node --input-type=module -e '
              const plugin = await import("@stolyarovmn/dsh-client-ui-schedule-tab");
              const seen = [];
              const entries = new Map();
              let serial = 0;
              const ctx = {
                loader: {
                  store: Object.create(null),
                  create: async ({ name }) => {
                    const id = "dynamic-" + String(++serial);
                    const entry = {
                      fiber: {
                        await: async () => { seen.push("ready:" + name); },
                        dispose: async () => { seen.push("dispose:" + name); },
                      },
                    };
                    entries.set(id, entry);
                    ctx.loader.store[id] = entry;
                    seen.push("create:" + name);
                    return id;
                  },
                  resolve: (id) => entries.get(id),
                  remove: (id) => {
                    delete ctx.loader.store[id];
                    entries.delete(id);
                  },
                },
                effect: async (fn) => { await fn(); },
                provide: (name) => { seen.push("provide:" + name); },
              };
              await plugin.apply(ctx);
              const expected = [
                "create:@deepseek-ai/dsh-time-context",
                "ready:@deepseek-ai/dsh-time-context",
                "create:@deepseek-ai/dsh-schedule",
                "ready:@deepseek-ai/dsh-schedule",
                "provide:scheduleTabBootstrap",
              ];
              if (JSON.stringify(seen) !== JSON.stringify(expected)) {
                throw new Error("unexpected bootstrap order: " + JSON.stringify(seen));
              }
            '
          )
