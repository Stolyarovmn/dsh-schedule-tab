name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:all
      - run: npm pack --dry-run

  dsh-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin with DSH 0.1.7-rc.2
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 --profile smoke --from-default-profile web --dump-config > /dev/null
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "id: schedule-tab" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-client-ui-schedule-tab" /tmp/dsh-config.txt
          grep -F "id: time-context" /tmp/dsh-config.txt
          grep -F "@deepseek-ai/dsh-time-context" /tmp/dsh-config.txt
          grep -F "id: schedule" /tmp/dsh-config.txt
          grep -F "@deepseek-ai/dsh-schedule" /tmp/dsh-config.txt
          if grep -F "scheduleTabBootstrap" /tmp/dsh-config.txt; then
            echo "legacy rc.1 bootstrap leaked into rc.2 composition" >&2
            exit 1
          fi
