name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:all
      - run: npm pack --dry-run

  dsh-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin with DSH 0.1.7-rc.2
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 --profile smoke --from-default-profile web --dump-config > /dev/null
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.2 --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "schedule-control-center" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-client-ui-schedule-control-center" /tmp/dsh-config.txt
          grep -F "id: time-context" /tmp/dsh-config.txt
          grep -F "id: schedule" /tmp/dsh-config.txt
          grep -F "id: ui-schedule" /tmp/dsh-config.txt
          ! grep -F "scheduleTabBootstrap" /tmp/dsh-config.txt
          (
            cd "$DSH_HOME/profiles/smoke"
            node --input-type=module -e '
              const plugin = await import("@stolyarovmn/dsh-client-ui-schedule-control-center");
              const seen = [];
              const makeEntry = (id) => {
                const entry = {
                  disabled: true,
                  fiber: undefined,
                  async update({ disabled }) {
                    entry.disabled = disabled;
                    seen.push((disabled ? "disable:" : "enable:") + id);
                    entry.fiber = disabled ? undefined : { await: async () => seen.push("ready:" + id) };
                  },
                };
                return entry;
              };
              const ctx = {
                loader: {
                  store: {
                    "time-context": makeEntry("time-context"),
                    schedule: makeEntry("schedule"),
                    "ui-schedule": makeEntry("ui-schedule"),
                  },
                  await: async () => {},
                },
                effect: async (fn) => { await fn(); },
              };
              await plugin.apply(ctx);
              const expected = [
                "enable:time-context", "ready:time-context",
                "enable:schedule", "ready:schedule",
                "enable:ui-schedule", "ready:ui-schedule",
              ];
              if (JSON.stringify(seen) !== JSON.stringify(expected)) {
                throw new Error("unexpected rc2 bootstrap: " + JSON.stringify(seen));
              }
            '
          )
