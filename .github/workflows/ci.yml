name: CI

on:
  push:
    branches: [main, dsh-0.2.0-rc.2, dsh-0.2.1-alpha.1, install-0.8.1-alpha.1-from-0.8.0, compat/dsh-0.2.1-rc.4]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm pack --dry-run

  dsh-install-smoke:
    strategy:
      fail-fast: false
      matrix:
        dsh-version:
          - 0.2.1-rc.2
          - 0.2.1-rc.3
          - 0.2.1-rc.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install into DSH ${{ matrix.dsh-version }}
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DSH_VERSION: ${{ matrix.dsh-version }}
        run: |
          pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" --profile smoke --from-default-profile web --dump-config > /tmp/dsh-base-config.txt
          grep -F "@deepseek-ai/dsh-schedule" /tmp/dsh-base-config.txt
          grep -F "@deepseek-ai/dsh-client-ui-schedule" /tmp/dsh-base-config.txt
          if grep -Fq "@deepseek-ai/dsh-experimental-schedule-bundle" /tmp/dsh-base-config.txt; then
            echo "retired Automation Tasks bundle unexpectedly present" >&2
            exit 1
          fi
          pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "schedule-attention-enhancer" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-client-ui-schedule-tab" /tmp/dsh-config.txt
      - name: Boot Web with built-in Schedule
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DSH_VERSION: ${{ matrix.dsh-version }}
        shell: bash
        run: |
          set +e
          timeout 15s pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" --profile smoke --port 0 --no-open > /tmp/dsh-web.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/dsh-web.log
          if grep -Eiq "Failed to load plugins|entry did not activate|web boot: .*failed|dynamic ctx does not expose \"inject\"" /tmp/dsh-web.log; then
            exit 1
          fi
          if ! grep -Eq "dsh web: http://127\\.0\\.0\\.1:" /tmp/dsh-web.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi
