- insert:
    # dsh 0.1.5-rc.3 through 0.1.7-rc.1 ship Schedule as an opt-in Host overlay.
    # Mount the same two Host services with this bundle so installing the tab
    # also makes schedule_create/list/delete available to newly created Agents.
    - id: schedule-tab-time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: schedule-tab-host
      name: '@deepseek-ai/dsh-schedule'

    - id: schedule-tab
      name: '@stolyarovmn/dsh-client-ui-schedule-tab'
