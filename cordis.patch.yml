# dsh 0.1.5-rc.3 through 0.1.7-rc.1 create/restore Web root Agents through
# session-controller. The legacy Schedule plugin intentionally attaches only to
# Agents created after Schedule loads, so hold the controller until this
# bundle's Host bootstrap has mounted Schedule and time-context.
- id: session-controller
  inject: [scheduleTabBootstrap]

- insert:
    - id: schedule-tab
      name: '@stolyarovmn/dsh-client-ui-schedule-tab'
