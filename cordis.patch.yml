# DSH 0.1.7-rc.2 ships Host-wide Schedule and time-context rows in the Web
# bundle, disabled by default. Enable those native rows and add only our custom
# global Schedule tab. Do not use the rc.1 session-controller bootstrap here:
# rc.2 Schedule already attaches to existing root Agents and itself depends on
# sessionController.
- id: time-context
  disabled: false

- id: schedule
  disabled: false

- insert:
    - id: schedule-tab
      name: '@stolyarovmn/dsh-client-ui-schedule-tab'
